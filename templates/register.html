{% extends "base.html" %}
{% block title %}Sign up · SprintBoard{% endblock %}
{% block content %}
<div class="auth">
  <h1>Create an account</h1>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Full name <input type="text" name="name" required autofocus></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" minlength="6" required>
      <small class="muted">At least 6 characters</small></label>
    <button class="btn btn-primary">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
